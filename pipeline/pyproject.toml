[project]
name = "vadibook"
version = "0.1.0"
description = "Kurtlar Vadisi transcript + knowledge-graph pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.15",
  "pydantic>=2.9",
  "rich>=13.9",
  "python-dotenv>=1.0",
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1",
  "torch>=2.8",
  "soundfile>=0.13",
  "numpy>=1.26",
  "sherpa-onnx>=1.13.8",
  "meilisearch>=0.43.0",
]

[project.scripts]
vadibook = "vadibook.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vadibook"]
